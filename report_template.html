<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UCM Maintenance Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        h1 { color: #2c3e50; }
        .section { margin-top: 1.5rem; }
        .log { white-space: pre-wrap; background:#f8f8f8; padding:1rem; border:1px solid #ddd; }
    </style>
</head>
<body>
    <h1>UCM Maintenance Report</h1>
    <div class="section"><strong>Date:</strong> {{DATE}}</div>
    <div class="section"><strong>Version:</strong> {{VERSION}}</div>
    <div class="section"><strong>Summary:</strong>
        <ul>
            {{SUMMARY_ITEMS}}
        </ul>
    </div>
    <div class="section"><strong>Log file:</strong> {{LOG_PATH}}</div>
    <div class="section"><strong>Full Log:</strong>
        <div class="log">
{{LOG_CONTENT}}
        </div>
    </div>
</body>
</html>
