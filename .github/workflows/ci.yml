name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats
      - name: Run tests
        run: |
          cd tests/bats
          bats .
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -exec shellcheck {} +

